services:
  web:
    build: .
    command: 'tsx watch web/index.js'
    ports:
      - 8000:8000
    develop:
      watch:
        - action: sync
          path: web/
          target: /app/web/
          initial_sync: true
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    environment:
      PORT: 8000
